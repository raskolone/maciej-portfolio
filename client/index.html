<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Maciej Wyrozumski - English Coach | CribroEnglish</title>
    <meta name="description" content="Maciej Wyrozumski - English Coach. 10 lat doswiadczenia, metoda full immersion, Business English. Online i w Bielsku-Bialej. Umow lekcje probna." />
    <meta name="keywords" content="English tutor, EdTech, AI learning, ADHD-friendly, online lessons, language teacher, lektor angielskiego, Bielsko-Biala, CribroEnglish" />
    <meta name="author" content="Maciej Wyrozumski" />
    <meta name="robots" content="index, follow" />
    <!-- Google Fonts: Cormorant Garamond (display) + DM Sans (body) + DM Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Dark mode init: apply theme before React hydrates to prevent flash -->
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var html = document.documentElement;
        html.classList.remove('light');
        if (stored === 'light') {
          html.classList.add('light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
